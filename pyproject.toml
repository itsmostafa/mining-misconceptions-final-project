[project]
name = "mining-misconceptions"
version = "0.1.0"
description = "Eedi Mining Misconceptions in Mathematics - Kaggle Competition"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.12.0",
    "datasets>=4.4.1",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.7",
    "nltk>=3.9.2",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "sentence-transformers[train]>=3.0.0",
    "torch>=2.0.0",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
]
